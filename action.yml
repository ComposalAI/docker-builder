name: Composal Docker builder
author: ComposalAI
description: Connect Buildx to an existing Composal builder with a persistent EBS cache on the AWS Gen2 fleet.
branding:
  icon: package
  color: purple
inputs:
  token:
    description: Composal API token for a member of the builder organization.
    required: true
  org:
    description: Composal organization slug or public ID.
    required: true
  builder:
    description: Existing organization builder slug or public ID.
    default: main-gen2
  wake-timeout:
    description: Maximum seconds to wait for the shared builder to become ready, before connecting Docker.
    default: '900'
  use:
    description: Select this context and Buildx builder for subsequent job steps. Set false for explicit outputs only.
    default: 'true'
  api-url:
    description: Composal API origin.
    default: https://composal.com
  install-cli:
    description: 'auto reuses a compatible installed CLI, otherwise installs privately; true always installs; false requires an installed CLI.'
    default: 'auto'
outputs:
  builder:
    description: Embedded Buildx builder. Pass to the build action's builder input and set DOCKER_CONTEXT to the context output.
  context:
    description: Docker context for explicit docker --context commands.
  driver:
    description: docker. Cache remains on the remote builder; omit external cache exporters.
runs:
  using: node24
  main: index.mjs
  post: post.mjs
  post-if: always()
